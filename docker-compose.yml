version: '3.8'

services:
  # postgres 서비스 제거 (Supabase 사용)
  
  redis:
    image: redis:6
    expose:
      - "6379"
    environment:
      - TZ=${TZ}
    volumes:
      - redis_data:/data
    networks:
      - chat-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./back
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      # postgres 의존성 제거
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - REDIS_URL=${REDIS_URL}
      - TZ=${TZ}
    networks:
      - chat-network
    restart: on-failure

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - TZ=${TZ}
    depends_on:
      - web
    networks:
      - chat-network

volumes:
  # postgres_data 볼륨 제거
  redis_data:

networks:
  chat-network:
    driver: bridge
